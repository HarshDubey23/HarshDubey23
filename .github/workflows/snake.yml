# Draws the contribution graph as a snake (dark + light) and publishes it to the `output` branch.
name: Contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff99d3&color_dots=#30000e,#5c0a26,#8f2050,#c94d8a,#ff99d3
            dist/snake-light.svg?color_snake=#3d0012&color_dots=#f3e1ea,#ffc2e4,#ff99d3,#c94d8a,#3d0012

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
