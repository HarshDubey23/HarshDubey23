# Draws the contribution graph as a snake (dark + light) and publishes it to the `output` branch.
name: Contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#FF6338&color_dots=#1A1A17,#3A4416,#6E8A1F,#A9CF2E,#D8FF3E
            dist/snake-light.svg?color_snake=#FF6338&color_dots=#E2DDD2,#E9F7A8,#D8FF3E,#9DBA1F,#11110F

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
