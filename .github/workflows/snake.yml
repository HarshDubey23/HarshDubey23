# Draws the contribution graph as a snake (dark + light) and publishes it to the `output` branch.
name: Contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff5a1f&color_dots=#161614,#3a2016,#7a3519,#c4481c,#ff5a1f
            dist/snake-light.svg?color_snake=#0b0b0a&color_dots=#ece7dc,#ffd2bf,#ff9b72,#ff5a1f,#0b0b0a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
