<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="03 — Toolkit"><title>03 — Toolkit</title><style>@font-face{font-family:'f-mono';src:url(data:font/woff;base64,) format('woff');}
@font-face{font-family:'f-sans';src:url(data:font/woff;base64,) format('woff');}
@font-face{font-family:'f-serif';src:url(data:font/woff;base64,) format('woff');}
@font-face{font-family:'f-serifi';src:url(data:font/woff;base64,) format('woff');}

.draw{animation:draw 1.6s cubic-bezier(.65,0,.35,1) both}
@keyframes draw{from{stroke-dashoffset:var(--n,1400)}to{stroke-dashoffset:0}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style><defs></defs><line x1="64" y1="24" x2="1216" y2="24" stroke="#D6D0C3" class="draw" style="stroke-dasharray:1152;--n:1152"/><g class="rise" style="animation-delay:.2s"><text x="64.0" y="58.0" font-family="f-mono" font-size="13" fill="#D9481F" text-anchor="start" xml:space="preserve" letter-spacing="1.6" >§03</text><text x="62.0" y="134.0" font-family="f-serif" font-size="78" fill="#11110F" text-anchor="start" xml:space="preserve" letter-spacing="-1" >Toolkit</text><text x="249.5" y="134.0" font-family="f-serifi" font-size="78" fill="#D9481F" text-anchor="start" xml:space="preserve" >.</text></g><g class="rise" style="animation-delay:.4s"><text x="1216.0" y="108.0" font-family="f-sans" font-size="17" fill="#67655F" text-anchor="end" xml:space="preserve" >What I reach for,</text><text x="1216.0" y="132.0" font-family="f-sans" font-size="17" fill="#67655F" text-anchor="end" xml:space="preserve" >and what I'm building now.</text></g></svg>